<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のメニュー</title>
<style>
  :root{
    --bg:#0B0D10; --panel:#15181C; --panel-2:#1D2126; --line:#2A2F35;
    --text:#ECEDEE; --muted:#9AA0A6; --accent:#FFB020; --danger:#FF5A4E;
    --done:#35D48A; --mono:'SF Mono','Menlo','Consolas',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Segoe UI',sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  header.topbar{
    padding:20px 16px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .page-title{font-size:20px; font-weight:800; letter-spacing:-0.02em;}
  .page-title.sub{font-size:18px;}
  .page-sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .icon-btn{
    background:none; border:none; color:var(--muted); font-size:20px;
    min-width:44px; min-height:44px; padding:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn-labeled{
    font-size:12px; font-weight:700; gap:2px; flex-direction:column; line-height:1.1;
  }
  .icon-btn-labeled .icon-btn-icon{font-size:16px; line-height:1;}

  main{flex:1; padding:16px 16px 200px;}

  .btn-add-ex{
    width:100%; padding:14px; margin-bottom:8px;
    border-radius:14px; border:1px dashed var(--line);
    background:none; color:var(--accent);
    font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn-copy-ex{
    width:100%; padding:14px; margin-bottom:8px;
    border-radius:14px; border:1px solid var(--line);
    background:var(--panel); color:var(--text);
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  }

  .copy-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:10px; max-height:240px; overflow-y:auto;
  }
  .copy-panel-title{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:12px;}
  .copy-day-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; padding:12px 14px; margin-bottom:8px;
    border-radius:12px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-size:14px; cursor:pointer; font-family:inherit;
  }
  .copy-day-item:last-child{margin-bottom:0;}
  .copy-day-item:active{border-color:var(--accent);}
  .copy-day-date{font-family:var(--mono); font-size:12px; color:var(--muted);}
  .copy-day-meta{font-size:13px; font-weight:700; margin-top:4px;}
  .copy-day-count{font-size:12px; color:var(--muted); flex-shrink:0;}

  .add-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:10px;
  }
  .add-panel label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:600;}
  .add-panel select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px; color:var(--text); font-size:16px; margin-bottom:16px; font-family:inherit;
  }
  .add-panel select:focus{outline:none; border-color:var(--accent);}
  .btn{
    display:block; width:100%; text-align:center; padding:18px 16px; border-radius:14px; border:none;
    font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#1a1200;}
  .btn-secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  .btn-ghost{background:none; color:var(--muted); border:1px solid var(--line); margin-top:10px;}

  .workout-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    margin-bottom:10px; position:relative; overflow:hidden;
  }
  .workout-card.is-done{background:rgba(53,212,138,.03);}
  .workout-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px;
  }
  .workout-card.is-expanded .workout-card-head{border-bottom:1px solid var(--line);}
  .workout-card-toggle{
    flex:1; min-width:0; display:flex; align-items:center; gap:10px;
    background:none; border:none; color:inherit; cursor:pointer;
    font-family:inherit; padding:0; text-align:left;
  }
  .workout-card-main{flex:1; min-width:0;}
  .workout-card-name{font-size:16px; font-weight:800; line-height:1.3;}
  .workout-card-part{font-size:12px; font-weight:700; margin-top:3px;}
  .workout-card-summary{
    font-size:13px; color:var(--muted); margin-top:5px;
    font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .workout-card.is-expanded .workout-card-summary{display:none;}
  .card-tap-hint{
    font-size:11px; color:var(--muted); margin-top:4px;
  }
  .workout-card.is-expanded .card-tap-hint{display:none;}
  .card-chevron{
    flex-shrink:0; width:24px; color:var(--muted); font-size:18px;
    transition:transform .2s; line-height:1;
  }
  .workout-card.is-expanded .card-chevron{transform:rotate(90deg);}
  .card-head-actions{display:flex; gap:10px; flex-shrink:0; align-items:center;}
  .card-done-toggle{
    width:44px; height:44px; border-radius:12px; border:2px solid var(--line);
    background:none; color:transparent; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .workout-card.is-done .card-done-toggle{border-color:var(--done); background:var(--done); color:#0B0D10;}
  .card-delete{
    width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
    background:none; color:var(--muted); font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .card-delete:active{color:var(--danger); border-color:var(--danger);}
  .workout-card-body{display:none; padding:14px;}
  .workout-card.is-expanded .workout-card-body{display:block;}

  .set-line{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .set-line.is-logged{
    border-left:2px solid var(--done); padding-left:8px; margin-left:-2px;
  }
  .set-line-label{font-size:12px; color:var(--muted); font-weight:600; width:48px; flex-shrink:0;}
  .set-line input{
    flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 10px; font-size:18px; color:var(--text); font-family:var(--mono); text-align:center;
  }
  .set-line input:focus{outline:none; border-color:var(--accent);}
  .set-line input::placeholder{color:var(--muted); font-size:13px;}
  .set-copy{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
    background:none; color:var(--accent); font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .set-remove-sm{
    width:40px; height:40px; border-radius:10px; border:none;
    background:none; color:var(--muted); font-size:18px; cursor:pointer; flex-shrink:0;
  }

  .btn-add-set-card{
    width:100%; padding:12px; margin-top:4px;
    border-radius:12px; border:1px dashed var(--line);
    background:none; color:var(--muted); font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-collapse-card{
    width:100%; padding:12px; margin-top:12px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text);
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }

  .empty-state{text-align:center; padding:48px 20px; color:var(--muted); line-height:1.7;}
  .empty-state .big{font-size:40px; margin-bottom:12px;}

  .finish-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    padding:16px 16px 28px; background:linear-gradient(to top, var(--bg) 80%, transparent);
  }

  .hist-item{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:10px;}
  .hist-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .hist-date{font-family:var(--mono); font-size:13px; color:var(--muted); font-weight:600;}
  .hist-copy{
    flex-shrink:0; min-height:40px; padding:8px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .hist-ex-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:6px 0; border-bottom:1px solid var(--line);
  }
  .hist-ex-row:last-child{border-bottom:none; padding-bottom:0;}
  .hist-ex-name{font-size:15px; font-weight:700; color:var(--text); flex:1; min-width:0;}
  .hist-ex-stats{font-size:13px; color:var(--muted); text-align:right; flex-shrink:0; max-width:55%; line-height:1.4;}

  .btn-today-workout{
    width:100%; padding:14px 16px; margin:4px 0 12px;
    border-radius:14px; border:none;
    background:var(--accent); color:#1a1200;
    font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .cal-hint{
    text-align:center; font-size:14px; color:var(--muted);
    line-height:1.6; margin-bottom:16px;
  }

  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-nav button{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:44px; height:44px; border-radius:10px; cursor:pointer;
  }
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .cal-cell{
    aspect-ratio:1; border-radius:12px; border:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; color:var(--muted); cursor:pointer;
  }
  .cal-cell.empty{border:none; background:none; cursor:default;}
  .cal-cell.today{
    border-color:var(--text); font-weight:800; color:var(--text);
    outline:2px solid var(--text); outline-offset:1px;
  }
  .cal-cell.trained{background:var(--done); color:#0B0D10; font-weight:800; outline:none;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:8px;}
  .cal-weekdays span{font-size:12px; color:var(--muted); font-weight:700;}

  .save-hint{
    font-size:12px; color:var(--muted); margin:-12px 0 16px; line-height:1.5;
  }

  .status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; margin-bottom:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
  }
  .status-bar .status-label{font-size:13px; font-weight:700;}
  .status-bar .status-label.before{color:var(--accent);}
  .status-bar .status-label.after{color:var(--done);}
  .status-bar .status-count{font-size:12px; color:var(--muted); font-family:var(--mono);}

  .export-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:20px;
  }
  .export-panel label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:600;}
  .export-row{display:flex; gap:12px; margin-bottom:16px;}
  .export-field{flex:1; min-width:0;}
  .export-field input[type="date"]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 10px; color:var(--text); font-size:16px; font-family:inherit;
  }
  .export-field input[type="date"]:focus{outline:none; border-color:var(--accent);}
  .export-meta{font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:16px;}
  .export-presets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .export-preset{
    padding:8px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .export-preset:active{border-color:var(--accent); color:var(--accent);}

  .add-type-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .add-type-tab{
    flex:1; padding:12px 10px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .add-type-tab.is-active{border-color:var(--accent); color:var(--accent); background:rgba(255,176,32,.08);}
  .video-embed-wrap{
    position:relative; padding-bottom:56.25%; height:0; overflow:hidden;
    border-radius:12px; margin-bottom:12px; background:#000;
  }
  .video-embed-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-note{font-size:13px; color:var(--muted); line-height:1.6;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   種目カタログ（部位ごとの配列）
   将来: recentIds, favoriteIds, templates 等を state に追加可能
   ============================================================ */
const STORAGE = {
  catalog: 'catalog_v2',
  history: 'history_v2',
  draft: 'draft_v2',
  workDate: 'work_date_v2',
  circuits: 'circuits_v2'
};

const DEFAULT_YOUTUBE_CIRCUITS = [
  { id:'yt_dumbbell', name:'YouTubeダンベルサーキット', url:'' },
  { id:'yt_chest', name:'YouTube胸サーキット', url:'' },
  { id:'yt_back', name:'YouTube背中サーキット', url:'' },
  { id:'yt_shoulder', name:'YouTube肩サーキット', url:'' },
  { id:'yt_legs', name:'YouTube脚サーキット', url:'' },
  { id:'yt_full', name:'YouTube全身サーキット', url:'' }
];

const DEFAULT_CATALOG = {
  chest:    { name:'胸',   color:'#FF6B6B', exercises:['ベンチプレス','インクラインベンチプレス','デクラインベンチプレス','ダンベルベンチプレス','インクラインダンベルプレス','ダンベルフライ','インクラインダンベルフライ','ケーブルクロスオーバー','ペックフライ','チェストプレス','プッシュアップ（腕立て伏せ）','ディップス'] },
  back:     { name:'背中', color:'#4FA8FF', exercises:['デッドリフト','ラットプルダウン','チンニング（懸垂）','アシストチンニング','ベントオーバーロー','バーベルロー','ダンベルロー','シーテッドロー','Tバーロー','ワンハンドロー','ストレートアームプルダウン','ケーブルロー','マシンロー','シュラッグ'] },
  shoulder: { name:'肩',   color:'#C78BFF', exercises:['ショルダープレス','ダンベルショルダープレス','ミリタリープレス','アーノルドプレス','サイドレイズ','フロントレイズ','リアレイズ','リアデルトフライ','フェイスプル','アップライトロー','ケーブルサイドレイズ','マシンショルダープレス'] },
  legs:     { name:'脚',   color:'#35D48A', exercises:['スクワット','フロントスクワット','スミスマシンスクワット','ハックスクワット','ブルガリアンスクワット','レッグプレス','レッグエクステンション','レッグカール','ルーマニアンデッドリフト','スティッフレッグデッドリフト','ランジ','ウォーキングランジ','カーフレイズ','シーテッドカーフレイズ','ヒップスラスト','グルートブリッジ','アダクター','アブダクター'] },
  biceps:   { name:'二頭', color:'#FFB020', exercises:['バーベルカール','EZバーカール','ダンベルカール','ハンマーカール','インクラインダンベルカール','プリーチャーカール','ケーブルカール','コンセントレーションカール'] },
  triceps:  { name:'三頭', color:'#FF8B6B', exercises:['ナローベンチプレス','トライセプスプレスダウン','オーバーヘッドエクステンション','ライイングトライセプスエクステンション','フレンチプレス','ケーブルキックバック','ダンベルキックバック','ディップス'] },
  abs:      { name:'腹筋', color:'#5FE0C8', exercises:['クランチ','シットアップ','レッグレイズ','ハンギングレッグレイズ','ケーブルクランチ','アブローラー','プランク','サイドプランク','ロシアンツイスト','バイシクルクランチ','リバースクランチ'] },
  forearm:  { name:'前腕', color:'#A0A5AB', exercises:['リストカール','リバースリストカール','リバースカール','ファーマーズウォーク','ハンドグリップ'] },
  cardio:   { name:'有酸素', color:'#6B9FFF', exercises:['トレッドミル','ランニング','ウォーキング','エアロバイク','クロストレーナー','ローイングマシン','ステアクライマー','縄跳び'] }
};

const PART_ORDER = ['chest','back','shoulder','legs','biceps','triceps','abs','forearm','cardio'];
const DEFAULT_SET_COUNT = 3;

let outsideCloseCleanup = null;

let state = {
  catalog: null,
  circuits: [],
  history: [],
  draft: null,
  workDate: null,
  screen: { name: 'calendar' },
  expandedExIds: [],
  meta: { recentIds: [], favoriteIds: [], templates: [] }
};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getWorkDate(){ return state.workDate || todayStr(); }
function isToday(d){ return d === todayStr(); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(key){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } }
async function save(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }

function createEmptySet(w='',r=''){ return { weight:String(w), reps:String(r) }; }
function createDefaultSets(n=DEFAULT_SET_COUNT){ return Array.from({length:n},()=>createEmptySet()); }

function getPart(partId){ return state.catalog[partId]; }
function getPartList(){ return PART_ORDER.map(id=>({ id, ...state.catalog[id] })); }
function getCircuit(id){ return state.circuits.find(c=>c.id===id); }

function youtubeEmbedUrl(url){
  if(!url) return '';
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([^&?/]+)/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : url;
}

function openCalendarScreen(){
  const n=new Date();
  state.screen={name:'calendar',year:n.getFullYear(),month:n.getMonth()};
}

async function openEditDate(date){
  state.workDate=isToday(date)?null:date;
  state.draft=null;
  state.expandedExIds=[];
  await save(STORAGE.workDate,state.workDate);
  state.screen={name:'home'};
  render();
}

function ensureDraft(){
  const date = getWorkDate();
  const hist = state.history.find(h=>h.date===date);

  if(state.draft && state.draft.date === date){
    if(!state.draft.exercises.length && hist)
      state.draft = JSON.parse(JSON.stringify(hist));
    return state.draft;
  }

  state.draft = hist
    ? JSON.parse(JSON.stringify(hist))
    : { date, exercises: [] };
  return state.draft;
}

function isWorkoutSaved(draft){
  const hist = state.history.find(h=>h.date===draft.date);
  if(!hist || !draft.exercises.length) return false;
  return JSON.stringify(normalizeExercises(hist.exercises)) === JSON.stringify(normalizeExercises(draft.exercises));
}

function normalizeExercises(list){
  return list.map(ex=>({
    name: ex.name,
    partId: ex.partId,
    type: ex.type || 'weight',
    videoUrl: ex.videoUrl || '',
    done: !!ex.done,
    sets: (ex.sets || []).map(s=>({ weight: s.weight||'', reps: s.reps||'' }))
  }));
}

function isSetLogged(set){ return !!(set.weight || set.reps); }

function getWorkoutStatus(draft){
  if(!draft.exercises.length) return 'empty';
  return isWorkoutSaved(draft) ? 'after' : 'before';
}

function addExerciseToDraft({ partId, name, type='weight', videoUrl='' }){
  const draft = ensureDraft();
  const id = 'we_'+Date.now();
  const ex = {
    id,
    partId,
    name,
    type,
    done: false,
    videoUrl: type === 'video' ? videoUrl : '',
    sets: type === 'video' ? [] : createDefaultSets()
  };
  draft.exercises.push(ex);
  return id;
}

function removeExerciseFromDraft(exId){
  const draft = ensureDraft();
  draft.exercises = draft.exercises.filter(e=>e.id!==exId);
}

function cloneExercisesForCopy(exercises){
  const base = Date.now();
  return exercises.map((ex,i)=>({
    id: 'we_'+(base+i),
    partId: ex.partId,
    name: ex.name,
    type: ex.type || 'weight',
    videoUrl: ex.videoUrl || '',
    done: false,
    sets: (ex.sets || []).map(s=>({ weight: s.weight||'', reps: s.reps||'' }))
  }));
}

async function copyDayToToday(sourceDate){
  const today = todayStr();
  if(sourceDate === today) return false;

  let sourceExercises = [];
  if(getWorkDate() === sourceDate){
    sourceExercises = ensureDraft().exercises;
  } else {
    sourceExercises = state.history.find(h=>h.date===sourceDate)?.exercises || [];
  }
  if(!sourceExercises.length) return false;

  const todayHist = state.history.find(h=>h.date===today);
  const todayDraft = state.draft?.date === today ? state.draft : null;
  const hasToday = !!(todayHist?.exercises?.length || todayDraft?.exercises?.length);
  if(hasToday){
    const ok = confirm(`${formatDateLabel(sourceDate)} のメニューを今日にコピーしますか？\n今日の種目は置き換わります。`);
    if(!ok) return false;
  }

  state.workDate = null;
  state.draft = { date: today, exercises: cloneExercisesForCopy(sourceExercises) };
  state.expandedExIds = [];
  await persist();
  state.screen = { name: 'home' };
  render();
  return true;
}

function formatDateLabel(d){
  if(isToday(d)) return '今日';
  const [y,m,day]=d.split('-').map(Number);
  return `${y}年${m}月${day}日`;
}

function formatDateWithWeekday(d){
  const [y,m,day]=d.split('-').map(Number);
  const wd=['日','月','火','水','木','金','土'][new Date(y,m-1,day).getDay()];
  return `${y}年${m}月${day}日（${wd}）`;
}

function getHistoryDateBounds(){
  const dates = state.history.map(h=>h.date).sort();
  const today = todayStr();
  if(!dates.length) return { min: today, max: today };
  return { min: dates[0], max: dates[dates.length-1] > today ? dates[dates.length-1] : today };
}

function getMonthRange(offset=0){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  const y = d.getFullYear();
  const m = d.getMonth();
  const start = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const endDay = new Date(y, m+1, 0).getDate();
  const end = `${y}-${String(m+1).padStart(2,'0')}-${String(endDay).padStart(2,'0')}`;
  return { start, end };
}

function buildExportRows(startDate, endDate){
  const rows = [];
  state.history
    .filter(h=>h.date>=startDate && h.date<=endDate)
    .sort((a,b)=>a.date.localeCompare(b.date) || 0)
    .forEach(h=>{
      h.exercises.forEach(ex=>{
        if(ex.type === 'video') return;
        (ex.sets || []).forEach(set=>{
          if(!isSetLogged(set)) return;
          rows.push({
            date: h.date,
            exercise: ex.name,
            reps: set.reps || '',
            weight: set.weight || ''
          });
        });
      });
    });
  return rows;
}

function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n\r]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
  return s;
}

function buildWorkoutCsv(rows){
  const lines = [['実施日','種目','回数','重量(kg)']];
  rows.forEach(r=>lines.push([r.date, r.exercise, r.reps, r.weight]));
  return lines.map(cols=>cols.map(csvEscape).join(',')).join('\r\n');
}

function downloadCsv(csv, filename){
  const blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportWorkoutCsv(startDate, endDate){
  const rows = buildExportRows(startDate, endDate);
  if(!rows.length){
    alert('指定期間にエクスポートできる記録がありません');
    return false;
  }
  const csv = buildWorkoutCsv(rows);
  downloadCsv(csv, `workout_${startDate}_${endDate}.csv`);
  return true;
}

/* ---- Render ---- */
function render(){
  const app = document.getElementById('app');
  if(state.screen.name==='home') app.innerHTML = renderHome();
  else if(state.screen.name==='history') app.innerHTML = renderHistory();
  else if(state.screen.name==='calendar') app.innerHTML = renderCalendar();
  else if(state.screen.name==='export') app.innerHTML = renderExport();
  else if(state.screen.name==='addExercise') app.innerHTML = renderAddExercise();
  attachHandlers();
}

function isExerciseExpanded(exId){
  return state.expandedExIds.includes(exId);
}

function toggleExerciseExpand(exId){
  if(isExerciseExpanded(exId)) state.expandedExIds = [];
  else state.expandedExIds = [exId];
}

function collapseExercise(exId){
  state.expandedExIds = state.expandedExIds.filter(id=>id!==exId);
}

function shouldIgnoreOutsideCollapse(target){
  if(!target) return true;
  if(target.closest('[data-toggle-expand]')) return true;
  if(target.closest('.finish-bar, header.topbar, [data-action], .btn-collapse-card')) return true;
  return false;
}

function handleSetInputBlur(exId){
  setTimeout(()=>{
    if(!isExerciseExpanded(exId)) return;
    const card = document.querySelector(`[data-card="${exId}"]`);
    const active = document.activeElement;
    if(card && card.contains(active)) return;
    collapseExercise(exId);
    render();
  }, 150);
}

function setupExpandOutsideClose(){
  if(outsideCloseCleanup){
    outsideCloseCleanup();
    outsideCloseCleanup = null;
  }
  if(state.screen.name !== 'home' || !state.expandedExIds.length) return;

  const exId = state.expandedExIds[0];
  const onOutside = (e)=>{
    if(!isExerciseExpanded(exId)) return;
    const card = document.querySelector(`[data-card="${exId}"]`);
    if(!card) return;
    if(card.contains(e.target)) return;
    if(shouldIgnoreOutsideCollapse(e.target)) return;
    collapseExercise(exId);
    render();
  };
  document.addEventListener('touchstart', onOutside, true);
  document.addEventListener('mousedown', onOutside, true);
  outsideCloseCleanup = ()=>{
    document.removeEventListener('touchstart', onOutside, true);
    document.removeEventListener('mousedown', onOutside, true);
  };
}

function renderExerciseSummary(ex){
  if(ex.type === 'video') return ex.done ? '動画視聴完了' : 'YouTubeサーキット';
  const logged = (ex.sets || []).filter(isSetLogged);
  if(!logged.length) return `${ex.sets.length}セット · 未入力`;
  const preview = logged.slice(0,2).map(s=>`${s.weight||'-'}kg×${s.reps||'-'}`).join(', ');
  const rest = logged.length > 2 ? ` 他${logged.length-2}セット` : '';
  const unlogged = ex.sets.length - logged.length;
  const tail = unlogged > 0 ? ` · 空${unlogged}` : '';
  return preview + rest + tail;
}

function renderSetLine(exId, set, i){
  const logged = isSetLogged(set);
  const n = i + 1;
  return `
    <div class="set-line ${logged?'is-logged':''}">
      <span class="set-line-label">セット${n}</span>
      <input type="number" inputmode="decimal" placeholder="kg" aria-label="セット${n} 重量"
        data-set-weight data-ex-id="${exId}" data-set-idx="${i}" value="${esc(set.weight)}">
      <input type="number" inputmode="numeric" placeholder="回" aria-label="セット${n} 回数"
        data-set-reps data-ex-id="${exId}" data-set-idx="${i}" value="${esc(set.reps)}">
      ${i>0 ? `<button type="button" class="set-copy" data-set-copy data-ex-id="${exId}" data-set-idx="${i}" aria-label="前セットをコピー" title="前セットをコピー">↳</button>` : '<span style="width:40px;flex-shrink:0"></span>'}
      <button type="button" class="set-remove-sm" data-set-remove data-ex-id="${exId}" data-set-idx="${i}" aria-label="セット${n}を削除">−</button>
    </div>`;
}

function renderWorkoutCard(ex){
  const part = getPart(ex.partId);
  const done = !!ex.done;
  const expanded = isExerciseExpanded(ex.id);
  const isVideo = ex.type === 'video';

  let bodyContent = '';
  if(isVideo){
    const embed = youtubeEmbedUrl(ex.videoUrl);
    bodyContent = embed
      ? `<div class="video-embed-wrap"><iframe src="${esc(embed)}" allowfullscreen loading="lazy"></iframe></div>`
      : `<div class="video-note">YouTube URLが未設定です。<br>種目を追加し直すか、URL付きサーキットを選んでください。</div>`;
  } else {
    const setLines = (ex.sets || []).map((s,i)=>renderSetLine(ex.id,s,i)).join('');
    const canAdd = (ex.sets || []).length < 10;
    bodyContent = `
      ${setLines}
      <button type="button" class="btn-add-set-card" data-add-set="${ex.id}" ${canAdd?'':'disabled'}>＋ セット追加</button>
      <button type="button" class="btn-collapse-card" data-collapse-ex="${ex.id}">閉じる</button>`;
  }

  const partLabel = isVideo ? 'YouTube' : (part?.name || '');
  const partColor = isVideo ? '#FF4444' : (part?.color || 'var(--muted)');

  return `
    <div class="workout-card ${done?'is-done':''} ${expanded?'is-expanded':''}" data-card="${ex.id}">
      <div class="workout-card-head">
        <button type="button" class="workout-card-toggle" data-toggle-expand="${ex.id}" aria-expanded="${expanded}" aria-label="${esc(ex.name)}を${expanded?'閉じる':'開く'}">
          <div class="workout-card-main">
            <div class="workout-card-name">${esc(ex.name)}</div>
            <div class="workout-card-part" style="color:${partColor}">${esc(partLabel)}</div>
            <div class="workout-card-summary">${esc(renderExerciseSummary(ex))}</div>
            ${!expanded ? '<div class="card-tap-hint">タップで入力 ›</div>' : ''}
          </div>
          <span class="card-chevron" aria-hidden="true">›</span>
        </button>
        <div class="card-head-actions">
          <button type="button" class="card-done-toggle" data-toggle-done="${ex.id}" aria-label="${done?'完了を取り消す':'種目を完了にする'}">${done?'✓':''}</button>
          <button type="button" class="card-delete" data-delete-ex="${ex.id}" aria-label="種目を削除">×</button>
        </div>
      </div>
      <div class="workout-card-body">
        ${bodyContent}
        ${isVideo ? `<button type="button" class="btn-collapse-card" data-collapse-ex="${ex.id}">閉じる</button>` : ''}
      </div>
    </div>`;
}

function renderStatusBar(draft){
  const status = getWorkoutStatus(draft);
  if(status === 'empty') return '';
  const doneCount = draft.exercises.filter(e=>e.done).length;
  const total = draft.exercises.length;
  if(status === 'after'){
    return `
      <div class="status-bar">
        <span class="status-label after">✓ トレーニング完了</span>
        <span class="status-count">${doneCount}/${total} 種目</span>
      </div>`;
  }
  return `
    <div class="status-bar">
      <span class="status-label before">● 記録中（やる前）</span>
      <span class="status-count">${doneCount}/${total} 種目完了</span>
    </div>`;
}

function renderAddExercise(){
  const addType = state.screen.addType || 'weight';
  const partId = state.screen.addPartId || PART_ORDER[0];
  const circuitId = state.screen.addCircuitId || state.circuits[0]?.id || '';
  const part = getPart(partId);
  const exOptions = part ? part.exercises.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('') : '';
  const partOptions = getPartList().map(p=>`<option value="${p.id}" ${p.id===partId?'selected':''}>${esc(p.name)}</option>`).join('');
  const circuitOptions = state.circuits.map(c=>`<option value="${c.id}" ${c.id===circuitId?'selected':''}>${esc(c.name)}</option>`).join('');
  const selectedCircuit = getCircuit(circuitId);
  const videoUrl = state.screen.addVideoUrl ?? selectedCircuit?.url ?? '';

  const weightFields = `
    <label>① 部位を選択</label>
    <select data-add-part>${partOptions}</select>
    <label>② 種目を選択</label>
    <select data-add-exercise>${exOptions}</select>`;

  const videoFields = `
    <label>YouTubeサーキットを選択</label>
    <select data-add-circuit>${circuitOptions}</select>
    <label>YouTube URL（任意）</label>
    <input type="url" data-add-video-url placeholder="https://www.youtube.com/watch?v=..." value="${esc(videoUrl)}" style="width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font-size:15px;font-family:inherit;margin-bottom:16px;">`;

  return `
    <header class="topbar">
      <button class="icon-btn" data-action="back-home" aria-label="戻る">‹</button>
      <div class="page-title sub">種目を追加</div>
      <div style="width:44px"></div>
    </header>
    <main>
      <div class="add-panel" style="margin-bottom:0;">
        <div class="add-type-tabs">
          <button type="button" class="add-type-tab ${addType==='weight'?'is-active':''}" data-set-add-type="weight">筋トレ種目</button>
          <button type="button" class="add-type-tab ${addType==='video'?'is-active':''}" data-set-add-type="video">YouTubeサーキット</button>
        </div>
        ${addType==='weight' ? weightFields : videoFields}
        <button class="btn btn-primary" data-action="confirm-add">追加する</button>
      </div>

}

function renderHome(){
  const draft = ensureDraft();
  const date = getWorkDate();
  const cards = draft.exercises.map(renderWorkoutCard).join('');
  const statusBar = renderStatusBar(draft);
  const saveLabel = '記録を保存';
  const canCopyToToday = !isToday(date) && draft.exercises.length;
  const dateLabel = formatDateWithWeekday(date);

  return `
    <header class="topbar">
      <button class="icon-btn" data-action="back-calendar" aria-label="筋トレログに戻る">‹</button>
      <div>
        <div class="page-title">${isToday(date) ? '今日のトレーニング' : formatDateLabel(date)}</div>
        <div class="page-sub">${dateLabel}</div>
      </div>
      <button class="icon-btn" data-action="history" aria-label="履歴">☰</button>
    </header>
    <main>
      ${statusBar}
      ${draft.exercises.length ? '<div class="save-hint">入力後は「記録を保存」をタップしてください</div>' : ''}
      ${cards || '<div class="empty-state"><div class="big">🏋️</div>種目を追加して<br>トレーニングを記録しましょう</div>'}
    </main>
    <div class="finish-bar">
      ${canCopyToToday ? '<button class="btn-copy-ex" data-action="copy-to-today">📋 本日にコピー</button>' : ''}
      <button class="btn-add-ex" data-action="go-add">＋ 種目を追加</button>
      <button class="btn btn-primary" data-action="save-workout" ${!draft.exercises.length?'disabled':''}>${saveLabel}</button>
    </div>`;
}

function renderHistory(){
  const today = todayStr();
  const items = [...state.history].reverse().map(h=>{
    const exLines = h.exercises.map(ex=>{
      if(ex.type === 'video'){
        return `<div class="hist-ex-row"><span class="hist-ex-name">${esc(ex.name)}</span><span class="hist-ex-stats">${ex.done?'視聴完了':'未視聴'}</span></div>`;
      }
      const logged = (ex.sets || []).filter(s=>s.weight||s.reps);
      const stats = logged.length
        ? logged.map(s=>`${s.weight||'-'}kg×${s.reps||'-'}`).join(' / ')
        : '未記録';
      return `<div class="hist-ex-row"><span class="hist-ex-name">${esc(ex.name)}</span><span class="hist-ex-stats">${esc(stats)}</span></div>`;
    }).join('');
    const canCopy = h.date !== today && h.exercises.length;
    return `<div class="hist-item">
      <div class="hist-head">
        <div class="hist-date">${h.date}</div>
        ${canCopy ? `<button type="button" class="hist-copy" data-copy-to-today="${h.date}">本日にコピー</button>` : ''}
      </div>
      ${exLines||'<div class="hist-ex-stats">記録なし</div>'}
    </div>`;
  }).join('');
  return `
    <header class="topbar">
      <button class="icon-btn" data-action="back-calendar" aria-label="筋トレログに戻る">‹</button>
      <div class="page-title sub">履歴</div>
      <button class="icon-btn icon-btn-labeled" data-action="export" aria-label="CSVダウンロード">
        <span class="icon-btn-icon">📥</span><span>CSV</span>
      </button>
    </header>
    <main>${items||'<div class="empty-state"><div class="big">📋</div>まだ履歴がありません</div>'}</main>`;
}

function renderExport(){
  const bounds = getHistoryDateBounds();
  const exportStart = state.screen.exportStart || bounds.min;
  const exportEnd = state.screen.exportEnd || bounds.max;
  const rowCount = buildExportRows(exportStart, exportEnd).length;
  const thisMonth = getMonthRange(0);
  const lastMonth = getMonthRange(-1);

  return `
    <header class="topbar">
      <button class="icon-btn" data-action="back-history" aria-label="履歴に戻る">‹</button>
      <div class="page-title sub">CSVダウンロード</div>
      <div style="width:44px"></div>
    </header>
    <main>
      <div class="export-panel">
        <div class="export-row">
          <div class="export-field">
            <label for="export-start">開始日</label>
            <input id="export-start" type="date" data-export-start value="${exportStart}" min="${bounds.min}" max="${bounds.max}">
          </div>
          <div class="export-field">
            <label for="export-end">終了日</label>
            <input id="export-end" type="date" data-export-end value="${exportEnd}" min="${bounds.min}" max="${bounds.max}">
          </div>
        </div>
        <div class="export-presets">
          <button type="button" class="export-preset" data-export-preset="this-month">今月</button>
          <button type="button" class="export-preset" data-export-preset="last-month">先月</button>
          <button type="button" class="export-preset" data-export-preset="all">全期間</button>
        </div>
        <div class="export-meta">${rowCount}件のセット記録が対象です<br>実施日・種目・回数・重量(kg) を1セット1行で出力します</div>
        <button class="btn btn-primary" data-action="download-csv">CSVをダウンロード</button>
      </div>
    </main>`;
}

function renderCalendar(){
  const {year,month}=state.screen;
  const first=new Date(year,month,1);
  const startWd=first.getDay();
  const dim=new Date(year,month+1,0).getDate();
  const todayS=todayStr();
  const byDate={};
  state.history.forEach(h=>{ byDate[h.date]=h; });
  const cells=[];
  for(let i=0;i<startWd;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let d=1;d<=dim;d++){
    const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const trained=!!byDate[ds];
    cells.push(`<div class="cal-cell ${trained?'trained':''} ${ds===todayS?'today':''}" data-cal-date="${ds}">${d}</div>`);
  }
  return `
    <header class="topbar">
      <div class="page-title">筋トレログ</div>
      <button class="icon-btn" data-action="history" aria-label="履歴">☰</button>
    </header>
    <main>
      <button type="button" class="btn-today-workout" data-action="go-today-edit">今日のトレーニング</button>
      <div class="cal-hint">日付をタップしてメニューを編集</div>
      <div class="cal-nav">
        <button data-cal-nav="-1" aria-label="前の月">‹</button>
        <div style="font-weight:800;font-family:var(--mono)">${year}年${month+1}月</div>
        <button data-cal-nav="1" aria-label="次の月">›</button>
      </div>
      <div class="cal-weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div class="cal-grid">${cells.join('')}</div>
    </main>`;
}

function attachHandlers(){
  const app=document.getElementById('app');

  app.querySelector('[data-action="back-calendar"]')?.addEventListener('click',()=>{ openCalendarScreen(); render(); });
  app.querySelector('[data-action="back-history"]')?.addEventListener('click',()=>{ state.screen={name:'history'}; render(); });
  app.querySelector('[data-action="back-home"]')?.addEventListener('click',()=>{ state.screen={name:'home'}; render(); });
  app.querySelector('[data-action="history"]')?.addEventListener('click',()=>{ state.screen={name:'history'}; render(); });
  app.querySelector('[data-action="export"]')?.addEventListener('click',()=>{
    const bounds = getHistoryDateBounds();
    state.screen={ name:'export', exportStart:bounds.min, exportEnd:bounds.max };
    render();
  });
  app.querySelector('[data-action="download-csv"]')?.addEventListener('click',()=>{
    const start = app.querySelector('[data-export-start]')?.value;
    const end = app.querySelector('[data-export-end]')?.value;
    if(!start || !end){ alert('期間を指定してください'); return; }
    if(start > end){ alert('開始日は終了日以前にしてください'); return; }
    exportWorkoutCsv(start, end);
  });
  app.querySelector('[data-export-start]')?.addEventListener('change',e=>{
    state.screen.exportStart = e.target.value;
    render();
  });
  app.querySelector('[data-export-end]')?.addEventListener('change',e=>{
    state.screen.exportEnd = e.target.value;
    render();
  });
  app.querySelectorAll('[data-export-preset]').forEach(el=>{
    el.onclick=()=>{
      const bounds = getHistoryDateBounds();
      const preset = el.getAttribute('data-export-preset');
      if(preset === 'this-month'){
        const r = getMonthRange(0);
        state.screen.exportStart = r.start < bounds.min ? bounds.min : r.start;
        state.screen.exportEnd = r.end > bounds.max ? bounds.max : r.end;
      } else if(preset === 'last-month'){
        const r = getMonthRange(-1);
        state.screen.exportStart = r.start < bounds.min ? bounds.min : r.start;
        state.screen.exportEnd = r.end > bounds.max ? bounds.max : r.end;
      } else {
        state.screen.exportStart = bounds.min;
        state.screen.exportEnd = bounds.max;
      }
      render();
    };
  });
  app.querySelector('[data-action="go-today-edit"]')?.addEventListener('click',()=>{ openEditDate(todayStr()); });
  app.querySelector('[data-action="go-add"]')?.addEventListener('click',()=>{
    state.screen={
      name:'addExercise',
      addType:'weight',
      addPartId:PART_ORDER[0],
      addCircuitId:state.circuits[0]?.id || '',
      addVideoUrl:''
    };
    render();
  });
  app.querySelector('[data-action="copy-to-today"]')?.addEventListener('click',async()=>{
    const ok = await copyDayToToday(getWorkDate());
    if(!ok) alert('本日にコピーできるメニューがありません');
  });
  app.querySelectorAll('[data-copy-to-today]').forEach(el=>{
    el.onclick=async()=>{
      const ok = await copyDayToToday(el.getAttribute('data-copy-to-today'));
      if(!ok) alert('本日にコピーできるメニューがありません');
    };
  });
  app.querySelectorAll('[data-set-add-type]').forEach(el=>{
    el.onclick=()=>{
      const addType = el.getAttribute('data-set-add-type');
      state.screen.addType = addType;
      if(addType === 'video'){
        state.screen.addCircuitId = state.screen.addCircuitId || state.circuits[0]?.id || '';
        state.screen.addVideoUrl = getCircuit(state.screen.addCircuitId)?.url || '';
      }
      render();
    };
  });
  app.querySelector('[data-add-part]')?.addEventListener('change',e=>{
    state.screen.addPartId=e.target.value; render();
  });
  app.querySelector('[data-add-circuit]')?.addEventListener('change',e=>{
    state.screen.addCircuitId=e.target.value;
    state.screen.addVideoUrl = getCircuit(e.target.value)?.url || '';
    render();
  });
  app.querySelector('[data-add-video-url]')?.addEventListener('input',e=>{
    state.screen.addVideoUrl = e.target.value;
  });
  app.querySelector('[data-action="confirm-add"]')?.addEventListener('click',async()=>{
    const addType = state.screen.addType || 'weight';
    let newId;
    if(addType === 'video'){
      const circuitId = app.querySelector('[data-add-circuit]')?.value;
      const circuit = getCircuit(circuitId);
      const videoUrl = app.querySelector('[data-add-video-url]')?.value?.trim() || circuit?.url || '';
      if(!circuit){ alert('サーキットを選択してください'); return; }
      newId = addExerciseToDraft({
        partId:'video',
        name:circuit.name,
        type:'video',
        videoUrl
      });
    } else {
      const partId=app.querySelector('[data-add-part]')?.value;
      const exName=app.querySelector('[data-add-exercise]')?.value;
      if(!partId||!exName) return;
      newId = addExerciseToDraft({ partId, name:exName, type:'weight' });
    }
    state.expandedExIds=[newId];
    state.screen={name:'home'};
    await persist();
    render();
  });

  app.querySelectorAll('[data-toggle-expand]').forEach(el=>{
    el.onclick=()=>{
      toggleExerciseExpand(el.getAttribute('data-toggle-expand'));
      render();
    };
  });

  app.querySelectorAll('[data-collapse-ex]').forEach(el=>{
    el.onclick=()=>{
      collapseExercise(el.getAttribute('data-collapse-ex'));
      render();
    };
  });

  app.querySelectorAll('.workout-card.is-expanded .workout-card-body').forEach(body=>{
    body.addEventListener('focusout',()=>{
      const exId = body.closest('[data-card]')?.getAttribute('data-card');
      if(exId) handleSetInputBlur(exId);
    });
  });

  setupExpandOutsideClose();

  app.querySelectorAll('[data-toggle-done]').forEach(el=>{
    el.onclick=async()=>{
      const draft=ensureDraft();
      const exId=el.getAttribute('data-toggle-done');
      const ex=draft.exercises.find(e=>e.id===exId);
      if(ex){
        ex.done=!ex.done;
        if(ex.done) collapseExercise(exId);
        await persist(); render();
      }
    };
  });

  app.querySelectorAll('[data-delete-ex]').forEach(el=>{
    el.onclick=async()=>{
      if(confirm('この種目を削除しますか？')){
        const exId=el.getAttribute('data-delete-ex');
        removeExerciseFromDraft(exId);
        state.expandedExIds=state.expandedExIds.filter(id=>id!==exId);
        await persist(); render();
      }
    };
  });

  app.querySelectorAll('[data-add-set]').forEach(el=>{
    el.onclick=async()=>{
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===el.getAttribute('data-add-set'));
      if(!ex||ex.type==='video'||!ex.sets||ex.sets.length>=10) return;
      const prev=ex.sets[ex.sets.length-1];
      ex.sets.push(createEmptySet(prev?.weight,prev?.reps));
      await persist(); render();
    };
  });

  app.querySelectorAll('[data-set-weight]').forEach(el=>{
    el.oninput=async()=>{
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===el.getAttribute('data-ex-id'));
      if(ex) ex.sets[+el.getAttribute('data-set-idx')].weight=el.value;
      await persist();
    };
    el.onblur=()=>handleSetInputBlur(el.getAttribute('data-ex-id'));
  });
  app.querySelectorAll('[data-set-reps]').forEach(el=>{
    el.oninput=async()=>{
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===el.getAttribute('data-ex-id'));
      if(ex) ex.sets[+el.getAttribute('data-set-idx')].reps=el.value;
      await persist();
    };
    el.onblur=()=>handleSetInputBlur(el.getAttribute('data-ex-id'));
  });

  app.querySelectorAll('[data-set-copy]').forEach(el=>{
    el.onclick=async()=>{
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===el.getAttribute('data-ex-id'));
      const idx=+el.getAttribute('data-set-idx');
      if(ex&&idx>0){
        ex.sets[idx].weight=ex.sets[idx-1].weight;
        ex.sets[idx].reps=ex.sets[idx-1].reps;
        await persist(); render();
      }
    };
  });

  app.querySelectorAll('[data-set-remove]').forEach(el=>{
    el.onclick=async()=>{
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===el.getAttribute('data-ex-id'));
      const idx=+el.getAttribute('data-set-idx');
      if(ex){ ex.sets.splice(idx,1); await persist(); render(); }
    };
  });

  app.querySelector('[data-action="save-workout"]')?.addEventListener('click',saveWorkout);

  app.querySelectorAll('[data-cal-nav]').forEach(el=>{
    el.onclick=()=>{
      let {year,month}=state.screen;
      month+=+el.getAttribute('data-cal-nav');
      if(month<0){month=11;year--;} if(month>11){month=0;year++;}
      state.screen.year=year; state.screen.month=month;
      render();
    };
  });
  app.querySelectorAll('[data-cal-date]').forEach(el=>{
    el.onclick=()=>{ openEditDate(el.getAttribute('data-cal-date')); };
  });
}

async function saveWorkout(){
  const draft=ensureDraft();
  if(!draft.exercises.length){ alert('種目を追加してください'); return; }
  const idx=state.history.findIndex(h=>h.date===draft.date);
  const entry=JSON.parse(JSON.stringify(draft));
  if(idx>=0) state.history[idx]=entry; else state.history.push(entry);
  state.draft=JSON.parse(JSON.stringify(entry));
  state.workDate=null;
  state.expandedExIds=[];
  await persist();
  openCalendarScreen();
  render();
}

async function persist(){
  await save(STORAGE.catalog,state.catalog);
  await save(STORAGE.circuits,state.circuits);
  await save(STORAGE.history,state.history);
  await save(STORAGE.draft,state.draft);
  await save(STORAGE.workDate,state.workDate);
}

function migrateFromV1(){
  // 旧データがあれば best-effort で移行（省略可）
}

async function init(){
  document.getElementById('app').innerHTML='<div class="empty-state">読み込み中…</div>';
  const [catalog,circuits,history,draft,workDate]=await Promise.all([
    load(STORAGE.catalog), load(STORAGE.circuits), load(STORAGE.history), load(STORAGE.draft), load(STORAGE.workDate)
  ]);
  state.catalog=catalog||DEFAULT_CATALOG;
  state.circuits=circuits?.length ? circuits : DEFAULT_YOUTUBE_CIRCUITS;
  state.history=history||[];
  state.draft=draft;
  state.workDate=workDate||null;
  const n=new Date();
  state.screen={name:'calendar',year:n.getFullYear(),month:n.getMonth()};
  if(!catalog || !circuits) await persist();
  render();
}

init();
</script>
</body>
</html>
